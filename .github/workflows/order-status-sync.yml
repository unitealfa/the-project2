name: Synchronisation des statuts ECOTRACK

on:
  schedule:
    # Decale de deux minutes pour eviter le pic du debut d'heure.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecotrack-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SYNC_URL: https://the-project2.vercel.app/api/orders/cron/sync-statuses
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifier la configuration GitHub
        shell: bash
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET GitHub absent::Ajoutez le secret CRON_SECRET dans Settings > Secrets and variables > Actions. Sa valeur doit etre identique a celle du backend Vercel."
            {
              echo "### Echec de configuration"
              echo "Le secret GitHub Actions \`CRON_SECRET\` est absent."
              echo "Ajoutez-le au depot avec exactement la meme valeur que dans le backend Vercel."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Appeler la synchronisation protegee
        shell: bash
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 70 \
            --retry 2 \
            --retry-delay 5 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL")"; then
            echo "::error title=Backend ECOTRACK injoignable::La requete vers le backend Vercel a echoue avant de recevoir une reponse HTTP."
            exit 1
          fi

          if [ "$http_status" = "409" ]; then
            echo "Une synchronisation est deja en cours."
            exit 0
          fi

          if [ "$http_status" = "401" ]; then
            echo "::error title=CRON_SECRET refuse par Vercel::Remplacez le secret GitHub CRON_SECRET par exactement la valeur configuree dans le backend Vercel."
            exit 1
          fi

          if [ "$http_status" = "503" ]; then
            echo "::error title=CRON_SECRET Vercel absent::Ajoutez CRON_SECRET aux variables Production du projet backend Vercel puis redeployez-le."
            exit 1
          fi

          if [ "$http_status" != "200" ]; then
            echo "::error title=Echec du backend de synchronisation::La route cron a retourne HTTP $http_status. Consultez les Runtime Logs du projet backend Vercel."
            exit 1
          fi

          if ! result="$(node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const n=(v)=>Number.isFinite(Number(v))?Number(v):0;const r={success:b.success===true,processed:n(b.processed),updates:n(b.updates),notFound:n(b.notFound),skipped:n(b.skipped),errors:n(b.errors),requestsMade:n(b.requestsMade)};console.log(JSON.stringify(r));if(!r.success)process.exit(1)' "$response_file")"; then
            echo "::error title=Reponse backend invalide::Le backend a retourne HTTP 200 sans confirmation success=true."
            exit 1
          fi

          echo "$result"
          {
            echo "### Synchronisation ECOTRACK terminee"
            echo "\`$result\`"
          } >> "$GITHUB_STEP_SUMMARY"
